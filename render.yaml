services:
  - type: web
    name: oreummok-cloud
    repo: https://github.com/goldensw1130/-sw
    branch: oreummok-cloud-server
    runtime: node
    plan: free
    numInstances: 1
    region: singapore
    rootDir: oreummok-cloud
    buildCommand: node --version
    startCommand: node service/cloud-server.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: OREUMMOK_DATA_DIR
        value: /tmp/oreummok-cache
      - key: SUPABASE_URL
        value: https://tccaipjgaijnnrwxuout.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OREUMMOK_ADMIN_USERNAME
        sync: false
      - key: OREUMMOK_ADMIN_PASSWORD
        sync: false
