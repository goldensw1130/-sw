name: OreumMok manual PC build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
      - shell: pwsh
        run: ./native-client-source/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OreumMok-PC-Manual-Verified
          path: |
            ci-output/OreumMokSetup-v*.exe
            ci-output/OreumMok-User-PC-v*.zip
            ci-output/RELEASE_1.0_ko.md
            ci-output/SHA256SUMS.json
          if-no-files-found: error
