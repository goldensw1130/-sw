name: OreumMok cloud validation
on:
  push:
    branches: [oreummok-cloud-server]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*-test.mjs
        working-directory: oreummok-cloud
